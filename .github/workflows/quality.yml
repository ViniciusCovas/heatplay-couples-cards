name: Quality
on:
  pull_request:
  push:
    branches: [main, codex/lets-get-close-launch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Legacy lint debt is recorded in docs/launch-review.md. Gate new surfaces.
      - run: npx eslint src/lib/supabaseConfig.ts src/integrations/supabase/client.ts src/App.tsx src/components/home/HeroDeck.tsx src/components/legal/LegalLayout.tsx src/pages/Home.tsx src/lib/localPlayCopy.ts src/components/home/landing-copy.ts src/components/navigation/AppHeader.tsx src/components/navigation/AccountHeader.tsx src/components/ui/language-selector.tsx src/lib/activeCardClock.ts src/hooks/useActiveCardTime.ts src/components/game/RoundFeedback.tsx src/components/game/ImmersiveCard.tsx src/components/game/VariationCard.tsx src/lib/cardVariations.ts src/lib/levelDeck.ts supabase/functions/_shared/round-policy.ts src/pages/Play.tsx src/components/game/LevelTiles.tsx src/pages/Together.tsx src/components/game/PhysicalCard.tsx src/components/game/GameCard.tsx src/components/home/LandingSections.tsx src/lib/togetherSession.ts src/lib/dailySpark.ts supabase/functions/_shared/date-deck.ts supabase/functions/_shared/spark-questions.ts supabase/functions/plan-date/index.ts --max-warnings=0
